[package]
name = "data-lake-benchmarks"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
env_logger = "0.11"
futures = "0.3"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }

# Both engines are consumed directly from git and resolve to Arrow 58.
# Keep these revisions in sync with the Results section in README.md.
arrow = "58"
arrow-array = "58"
arrow-schema = "58"
opendal = "0.57"

indexlake = { git = "https://github.com/systemxlabs/indexlake", rev = "4e3ff351ac4c5a05ce4d469b91f48bf883d75e87" }
indexlake-catalog-postgres = { git = "https://github.com/systemxlabs/indexlake", rev = "4e3ff351ac4c5a05ce4d469b91f48bf883d75e87" }
indexlake-index-hnsw = { git = "https://github.com/systemxlabs/indexlake", rev = "4e3ff351ac4c5a05ce4d469b91f48bf883d75e87" }
indexlake-storage-s3 = { git = "https://github.com/systemxlabs/indexlake", rev = "4e3ff351ac4c5a05ce4d469b91f48bf883d75e87" }

lance = { git = "https://github.com/lance-format/lance", rev = "51415518c7566c938ba14fe29bcb357b8adf2123" }
lance-index = { git = "https://github.com/lance-format/lance", rev = "51415518c7566c938ba14fe29bcb357b8adf2123" }
lance-linalg = { git = "https://github.com/lance-format/lance", rev = "51415518c7566c938ba14fe29bcb357b8adf2123" }
